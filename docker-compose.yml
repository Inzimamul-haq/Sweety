services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sweety
    ports:
      - '5432:5432'
    volumes:
      - sweety_pg:/var/lib/postgresql/data
      - ./sweety-BE/db/init:/docker-entrypoint-initdb.d

volumes:
  sweety_pg:
